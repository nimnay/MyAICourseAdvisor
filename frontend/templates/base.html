<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Advisor{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --orange: #F56600;
            --purple: #522D80;
            --ink: #1b1b1b;
            --muted: #666;
            --line: #e2e2e2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Lexend', sans-serif;
            color: var(--ink);
            margin: 0;
            padding: 0 16px 48px;
            max-width: 1100px;
            margin-inline: auto;
            line-height: 1.5;
        }
        header { text-align: center; padding: 16px 0 0; }
        header img { height: 72px; }
        h1 {
            font-size: clamp(24px, 4vw, 34px);
            color: var(--orange);
            text-align: center;
            margin: 8px 0 4px;
        }
        .lede { text-align: center; color: var(--muted); margin: 0 0 28px; }
        h2 {
            font-size: 19px;
            color: var(--purple);
            border-bottom: 2px solid var(--line);
            padding-bottom: 6px;
            margin: 32px 0 14px;
        }

        form { display: grid; gap: 14px; }
        label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 4px; }
        .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
        input[type=text] {
            width: 100%;
            padding: 10px 12px;
            font: inherit;
            border: 1px solid var(--line);
            border-radius: 6px;
        }
        input[type=text]:focus-visible, button:focus-visible {
            outline: 3px solid var(--orange);
            outline-offset: 2px;
        }
        .check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: var(--orange);
            border: 0;
            border-radius: 6px;
            padding: 11px 22px;
            cursor: pointer;
            justify-self: start;
        }
        button:hover { background: #d95a00; }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 26px;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .credits { font-size: 30px; font-weight: 700; color: var(--purple); }
        .note {
            border-left: 4px solid var(--orange);
            background: #fdf7f2;
            padding: 12px 16px;
            margin: 16px 0;
        }
        .warn {
            border-left: 4px solid #b8860b;
            background: #fffdf3;
            padding: 10px 14px;
            font-size: 14px;
            margin: 12px 0;
        }

        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; }
        code { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }

        /* Calendar: one column per weekday, one grid row per quarter hour. */
        .calendar {
            display: grid;
            grid-template-columns: 52px repeat(5, 1fr);
            gap: 2px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            overflow-x: auto;
        }
        .cal-head { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 4px; }
        .cal-col { display: grid; gap: 2px; }
        .cal-hour {
            font-size: 11px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-right: 6px;
            text-align: right;
        }
        .cal-block {
            background: var(--purple);
            color: #fff;
            border-radius: 5px;
            padding: 4px 6px;
            font-size: 11px;
            overflow: hidden;
        }
        .cal-block strong { display: block; font-size: 12px; }
        .cal-empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

        progress { width: 160px; height: 10px; }
        .done { color: #2e7d32; font-weight: 600; }

        @media (max-width: 620px) {
            .calendar { grid-template-columns: 42px repeat(5, minmax(78px, 1fr)); }
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='clemson_logo.png') }}" alt="Clemson tiger paw">
    </header>

    {% block content %}{% endblock %}
</body>
</html>
